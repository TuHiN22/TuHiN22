name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate BDIX project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=BDIX-OpenWRT-CUDY-WR3000-V1&title_color=FF4ECD&icon_color=22D3EE&text_color=C9D1D9&bg_color=0B1020&border_color=FF4ECD
          path: profile/pin-bdix.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TuHiNiPTV project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=TuHiNiPTV&title_color=FF4ECD&icon_color=22D3EE&text_color=C9D1D9&bg_color=0B1020&border_color=FF4ECD
          path: profile/pin-tuhiniptv.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate BloodiCE Music Bot card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=BloodiCE-Music-BOT&title_color=FF4ECD&icon_color=22D3EE&text_color=C9D1D9&bg_color=0B1020&border_color=FF4ECD
          path: profile/pin-bloodice-music-bot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MusicBotWebsite card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=MusicBotWebsite&title_color=FF4ECD&icon_color=22D3EE&text_color=C9D1D9&bg_color=0B1020&border_color=FF4ECD
          path: profile/pin-musicbotwebsite.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile assets" || exit 0
          git push
