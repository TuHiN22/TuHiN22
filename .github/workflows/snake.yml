name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"     # regenerates once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322d3ee&color_dots=%230b1020,%233b82f6,%2306b6d4,%238b5cf6,%23ff4ecd
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f8fafc&color_dots=%230b1020,%233b82f6,%2306b6d4,%238b5cf6,%23ff4ecd

      - name: Push snake SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
